name: Auto-unpack uploaded ZIP and create PR

on:
  push:
    branches:
      - main
    paths:
      - '**/*.zip'
  workflow_dispatch: {}

jobs:
  unpack-and-pr:
    name: Unpack ZIP and create PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP
        id: findzip
        run: |
          set -euo pipefail
          ZIP=$(git ls-files '*.zip' | head -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "zip_found=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "zip_found=true" >> $GITHUB_OUTPUT
          echo "zip_path=$ZIP" >> $GITHUB_OUTPUT

      - name: Unpack and copy cranium-push content
        if: steps.findzip.outputs.zip_found == 'true'
        run: |
          set -euo pipefail
          ZIP_PATH="${{ steps.findzip.outputs.zip_path }}"
          TMPDIR=$(mktemp -d)
          unzip -q "$ZIP_PATH" -d "$TMPDIR"

          if [ -d "$TMPDIR/cranium-push" ]; then
            cp -r "$TMPDIR/cranium-push/." .
          else
            echo "ERROR: cranium-push directory not found inside zip" >&2
            ls -la "$TMPDIR"
            exit 1
          fi

      - name: Show git status
        if: steps.findzip.outputs.zip_found == 'true'
        run: |
          git status --porcelain

      - name: Fail if no changes
        if: steps.findzip.outputs.zip_found == 'true'
        run: |
          if git diff --quiet --ignore-submodules --exit-code; then
            echo "No changes to commit after unpacking. Exiting."
            exit 0
          fi

      - name: Set branch name
        if: steps.findzip.outputs.zip_found == 'true'
        run: |
          echo "BRANCH=ai/unpack-$(date +%s)" >> $GITHUB_ENV

      - name: Create Pull Request (commit & push workspace changes)
        if: steps.findzip.outputs.zip_found == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.BRANCH }}
          title: "Add governed commit path, receipt chain, kernel invariants, and first adversarial property registry"
          body: |
            Automated unpack of uploaded ZIP by workflow. Please review the proposed changes.
            
            - AuthorityReceipt + ReceiptChain + InMemoryReceiptChain
            - CommitOrchestrator as sole production entry point
            - AuthorityMonotonicityInvariant, ProtectedLaneInvariant, NoIsolatedSubjectInvariant
            - AuthorityTransitionEvaluated domain event
            - Simplified pure KernelStateReducer with version + duplicate-ID guards
            - PROPERTY_REGISTRY.md (adversarial property tracking)
            - StaleStateAttackTest (ATTACK-001)
          base: main
          labels: |
            automated
            unpack

      - name: Done
        run: echo "Unpack + PR job complete"
